AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GTM Backend - CI/CD stack.
  ECR repository + GitHub OIDC provider + deploy role for GitHub Actions.

Parameters:
  EnvironmentName:
    Type: String
    Default: gtm
    AllowedPattern: "[a-z0-9-]+"

  GitHubOrg:
    Type: String
    Description: "GitHub org or username (e.g. my-org)"

  GitHubRepo:
    Type: String
    Description: "GitHub repo name (e.g. gtm-backend)"

  GitHubBranch:
    Type: String
    Default: main
    Description: Branch allowed to deploy

Resources:
  # ──────────────────────────────────────────────
  #  ECR repository
  # ──────────────────────────────────────────────
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${EnvironmentName}-backend"
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 5 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-backend"

  # ──────────────────────────────────────────────
  #  GitHub OIDC provider (one per account)
  # ──────────────────────────────────────────────
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  # ──────────────────────────────────────────────
  #  Deploy role for GitHub Actions
  # ──────────────────────────────────────────────
  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  !Sub "repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: !Sub "${EnvironmentName}-deploy-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Push images to ECR
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                Resource: !GetAtt ECRRepository.Arn
              # SSM Run Command to trigger deploy on EC2
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource:
                  - !Sub "arn:aws:ssm:${AWS::Region}::document/AWS-RunShellScript"
                  - !Sub "arn:aws:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"

Outputs:
  ECRRepositoryUri:
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub "${EnvironmentName}-ECRRepositoryUri"

  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
    Export:
      Name: !Sub "${EnvironmentName}-GitHubDeployRoleArn"

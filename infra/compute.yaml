AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GTM Backend - Compute stack.
  EC2 instance with Docker, Nginx reverse proxy, Let's Encrypt TLS,
  CloudWatch Logs, and SSM-based secret injection.

Parameters:
  EnvironmentName:
    Type: String
    Default: gtm
    AllowedPattern: "[a-z0-9-]+"

  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues:
      - t4g.micro
      - t3.micro

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: EC2 key pair for SSH access

  DomainName:
    Type: String
    Description: Domain for Let's Encrypt TLS (e.g. api.example.com)

  LetsEncryptEmail:
    Type: String
    Description: Email for Let's Encrypt certificate notifications

  ECRImageUri:
    Type: String
    Description: "Full ECR image URI (account.dkr.ecr.region.amazonaws.com/repo:tag)"

  FrontendUrl:
    Type: String
    Default: "https://app.example.com"
    Description: Frontend origin for CORS

  Arm64AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Latest Amazon Linux 2023 ARM64 AMI

  Amd64AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 x86_64 AMI

Conditions:
  UseArm64: !Equals [!Select [0, !Split [".", !Select [0, !Split ["g", !Ref InstanceType]]]], "t4"]

Resources:
  # ──────────────────────────────────────────────
  #  Security group - EC2
  # ──────────────────────────────────────────────
  EC2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: GTM EC2 - HTTP/HTTPS/SSH only
      VpcId: !ImportValue
        Fn::Sub: "${EnvironmentName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH (restrict to your IP in production)
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-ec2-sg"

  # SG-to-SG: allow EC2 → RDS on port 5432
  DBIngressFromEC2:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !ImportValue
        Fn::Sub: "${EnvironmentName}-DBSecurityGroupId"
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref EC2SecurityGroup
      Description: PostgreSQL from EC2

  # ──────────────────────────────────────────────
  #  IAM role - least privilege
  # ──────────────────────────────────────────────
  EC2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-ec2-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${EnvironmentName}-ec2-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Read DB secret from Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !ImportValue
                  Fn::Sub: "${EnvironmentName}-DBSecretArn"
              # Read app config from SSM Parameter Store
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/gtm/*"
              # Pull images from ECR
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                Resource: "*"
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/gtm/*"

  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2Role

  # ──────────────────────────────────────────────
  #  CloudWatch log group
  # ──────────────────────────────────────────────
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/gtm/${EnvironmentName}/app"
      RetentionInDays: 7

  NginxLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/gtm/${EnvironmentName}/nginx"
      RetentionInDays: 7

  # ──────────────────────────────────────────────
  #  EC2 instance
  # ──────────────────────────────────────────────
  EC2Instance:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        configSets:
          full_install:
            - install_packages
            - configure_nginx
            - configure_app
            - start_services

        install_packages:
          packages:
            yum:
              docker: []
              nginx: []
              amazon-cloudwatch-agent: []
              jq: []
          commands:
            01_enable_docker:
              command: systemctl enable docker && systemctl start docker
            02_add_user_to_docker:
              command: usermod -aG docker ec2-user
            03_install_certbot:
              command: |
                # pip install fails on AL2023 (externally-managed environment); the dnf
                # fallback is what actually installs certbot, and it also provides
                # /usr/lib/systemd/system/certbot-renew.timer used by setup-tls.sh.
                python3 -m pip install certbot certbot-nginx 2>/dev/null || dnf install -y certbot python3-certbot-nginx

        configure_nginx:
          files:
            /etc/nginx/conf.d/gtm.conf:
              content: !Sub |
                server {
                    listen 80;
                    server_name ${DomainName};

                    location /.well-known/acme-challenge/ {
                        root /var/www/certbot;
                    }

                    location / {
                        return 301 https://$host$request_uri;
                    }
                }
              mode: "000644"
            /etc/nginx/conf.d/gtm-ssl.conf.template:
              content: !Sub |
                upstream gtm_api {
                    server 127.0.0.1:3001;
                }

                server {
                    listen 443 ssl http2;
                    server_name ${DomainName};

                    ssl_certificate     /etc/letsencrypt/live/${DomainName}/fullchain.pem;
                    ssl_certificate_key /etc/letsencrypt/live/${DomainName}/privkey.pem;
                    ssl_protocols       TLSv1.2 TLSv1.3;
                    ssl_ciphers         HIGH:!aNULL:!MD5;

                    # WebSocket support for Socket.IO
                    location /notifications {
                        proxy_pass http://gtm_api;
                        proxy_http_version 1.1;
                        proxy_set_header Upgrade $http_upgrade;
                        proxy_set_header Connection "upgrade";
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                        proxy_read_timeout 86400;
                    }

                    location / {
                        proxy_pass http://gtm_api;
                        proxy_set_header Host $host;
                        proxy_set_header X-Real-IP $remote_addr;
                        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                        proxy_set_header X-Forwarded-Proto $scheme;
                    }
                }
              mode: "000644"
          commands:
            01_mkdir_certbot:
              command: mkdir -p /var/www/certbot
            02_remove_default:
              command: rm -f /etc/nginx/conf.d/default.conf

        configure_app:
          files:
            /opt/gtm/deploy.sh:
              content: !Sub |
                #!/bin/bash
                set -euo pipefail

                REGION="${AWS::Region}"
                ECR_IMAGE="${ECRImageUri}"
                CONTAINER_NAME="gtm-api"

                # Authenticate with ECR
                aws ecr get-login-password --region "$REGION" | \
                  docker login --username AWS --password-stdin \
                  "$(echo "$ECR_IMAGE" | cut -d/ -f1)"

                # Pull latest image
                docker pull "$ECR_IMAGE"

                # Fetch DB credentials from Secrets Manager
                DB_SECRET=$(aws secretsmanager get-secret-value \
                  --secret-id "${EnvironmentName}/db-credentials" \
                  --region "$REGION" \
                  --query SecretString --output text)

                DB_USER=$(echo "$DB_SECRET" | jq -r .username)
                DB_PASS=$(echo "$DB_SECRET" | jq -r .password)
                DB_HOST=$(echo "$DB_SECRET" | jq -r .host)
                DB_PORT=$(echo "$DB_SECRET" | jq -r .port)
                DB_NAME=$(echo "$DB_SECRET" | jq -r .dbname)

                DATABASE_URL="postgresql://$DB_USER:$DB_PASS@$DB_HOST:$DB_PORT/$DB_NAME?schema=public"

                get_param() {
                  aws ssm get-parameter \
                    --name "$1" \
                    --with-decryption \
                    --region "$REGION" \
                    --query 'Parameter.Value' \
                    --output text
                }

                JWT_SECRET=$(get_param /gtm/jwt-secret)
                SMTP_HOST=$(get_param /gtm/smtp-host)
                SMTP_PORT=$(get_param /gtm/smtp-port)
                SMTP_SECURE=$(get_param /gtm/smtp-secure)
                SMTP_USER=$(get_param /gtm/smtp-user)
                SMTP_PASS=$(get_param /gtm/smtp-pass)
                SMTP_FROM=$(get_param /gtm/smtp-from)
                TWILIO_ACCOUNT_SID=$(get_param /gtm/twilio-account-sid)
                TWILIO_AUTH_TOKEN=$(get_param /gtm/twilio-auth-token)
                TWILIO_PHONE_NUMBER=$(get_param /gtm/twilio-phone-number)
                TWILIO_MESSAGING_SERVICE_SID=$(get_param /gtm/twilio-messaging-service-sid)

                # Stop existing container
                docker stop "$CONTAINER_NAME" 2>/dev/null || true
                docker rm "$CONTAINER_NAME" 2>/dev/null || true

                # Run container
                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --log-driver awslogs \
                  --log-opt awslogs-region="$REGION" \
                  --log-opt awslogs-group="/gtm/${EnvironmentName}/app" \
                  --log-opt awslogs-stream="$(hostname)-$(date +%Y%m%d)" \
                  -p 127.0.0.1:3001:3001 \
                  -e DATABASE_URL="$DATABASE_URL" \
                  -e PORT=3001 \
                  -e NODE_ENV=production \
                  -e JWT_SECRET="$JWT_SECRET" \
                  -e FRONTEND_URL="${FrontendUrl}" \
                  -e SMTP_HOST="$SMTP_HOST" \
                  -e SMTP_PORT="$SMTP_PORT" \
                  -e SMTP_SECURE="$SMTP_SECURE" \
                  -e SMTP_USER="$SMTP_USER" \
                  -e SMTP_PASS="$SMTP_PASS" \
                  -e SMTP_FROM="$SMTP_FROM" \
                  -e TWILIO_ACCOUNT_SID="$TWILIO_ACCOUNT_SID" \
                  -e TWILIO_AUTH_TOKEN="$TWILIO_AUTH_TOKEN" \
                  -e TWILIO_PHONE_NUMBER="$TWILIO_PHONE_NUMBER" \
                  -e TWILIO_MESSAGING_SERVICE_SID="$TWILIO_MESSAGING_SERVICE_SID" \
                  "$ECR_IMAGE" \
                  sh -c "npx prisma db push && node dist/src/main.js"

                echo "Deploy complete: $ECR_IMAGE"
              mode: "000755"

            /opt/gtm/setup-tls.sh:
              content: !Sub |
                #!/bin/bash
                set -euo pipefail

                DOMAIN="${DomainName}"
                EMAIL="${LetsEncryptEmail}"

                # Start nginx for ACME challenge
                systemctl start nginx

                # Obtain certificate
                certbot certonly --nginx \
                  -d "$DOMAIN" \
                  --non-interactive \
                  --agree-tos \
                  --email "$EMAIL"

                # Enable the SSL config
                cp /etc/nginx/conf.d/gtm-ssl.conf.template \
                   /etc/nginx/conf.d/gtm-ssl.conf

                # Reload nginx with SSL
                nginx -t && systemctl reload nginx

                # Safe renewal deploy hook: validate nginx config, reload ONLY if valid.
                # Exits non-zero (skipping the reload) when nginx -t fails.
                mkdir -p /etc/letsencrypt/renewal-hooks/deploy
                printf '%s\n' \
                  '#!/bin/bash' \
                  'set -euo pipefail' \
                  '/usr/sbin/nginx -t' \
                  '/usr/bin/systemctl reload nginx' \
                  > /etc/letsencrypt/renewal-hooks/deploy/00-reload-nginx.sh
                chown root:root /etc/letsencrypt/renewal-hooks/deploy/00-reload-nginx.sh
                chmod 0755 /etc/letsencrypt/renewal-hooks/deploy/00-reload-nginx.sh

                # Automatic renewal via the certbot RPM's own systemd timer.
                # NOTE: Amazon Linux 2023 ships NO cron daemon - /etc/cron.d is never
                # read, so the previous cron-based approach silently never ran.
                systemctl enable --now certbot-renew.timer
                systemctl is-active --quiet certbot-renew.timer
              mode: "000755"

            /opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json:
              content: !Sub |
                {
                  "logs": {
                    "logs_collected": {
                      "files": {
                        "collect_list": [
                          {
                            "file_path": "/var/log/nginx/access.log",
                            "log_group_name": "/gtm/${EnvironmentName}/nginx",
                            "log_stream_name": "{instance_id}/access",
                            "retention_in_days": 7
                          },
                          {
                            "file_path": "/var/log/nginx/error.log",
                            "log_group_name": "/gtm/${EnvironmentName}/nginx",
                            "log_stream_name": "{instance_id}/error",
                            "retention_in_days": 7
                          },
                          {
                            "file_path": "/var/log/letsencrypt/letsencrypt.log",
                            "log_group_name": "/gtm/${EnvironmentName}/certbot",
                            "log_stream_name": "{instance_id}/renewal",
                            "retention_in_days": 90,
                            "filters": [
                              { "type": "exclude", "expression": "\"signature\"" },
                              { "type": "exclude", "expression": "\"jwk\"" },
                              { "type": "exclude", "expression": "\"protected\"" },
                              { "type": "exclude", "expression": "BEGIN CERTIFICATE" },
                              { "type": "exclude", "expression": "^[A-Za-z0-9+/=_-]{64,}$" }
                            ]
                          }
                        ]
                      }
                    }
                  }
                }
              mode: "000644"

        start_services:
          commands:
            01_start_cw_agent:
              command: |
                /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl \
                  -a fetch-config -m ec2 \
                  -c file:/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json -s
            02_start_nginx:
              command: systemctl enable nginx && systemctl start nginx
            03_deploy_app:
              command: /opt/gtm/deploy.sh

    Properties:
      InstanceType: !Ref InstanceType
      ImageId: !If
        - UseArm64
        - !Ref Arm64AmiId
        - !Ref Amd64AmiId
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref EC2InstanceProfile
      SubnetId: !ImportValue
        Fn::Sub: "${EnvironmentName}-PublicSubnetAId"
      SecurityGroupIds:
        - !Ref EC2SecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 20
            VolumeType: gp3
            Encrypted: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -xe
          yum update -y
          yum install -y aws-cfn-bootstrap

          /opt/aws/bin/cfn-init -v \
            --stack ${AWS::StackName} \
            --resource EC2Instance \
            --configsets full_install \
            --region ${AWS::Region}

          /opt/aws/bin/cfn-signal -e $? \
            --stack ${AWS::StackName} \
            --resource EC2Instance \
            --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-api"

    CreationPolicy:
      ResourceSignal:
        Timeout: PT15M

  # ──────────────────────────────────────────────
  #  Elastic IP (free when attached to running instance)
  # ──────────────────────────────────────────────
  EIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-eip"

  EIPAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref EC2Instance
      AllocationId: !GetAtt EIP.AllocationId

Outputs:
  PublicIP:
    Description: Elastic IP - point your DNS A record here
    Value: !Ref EIP

  SSHCommand:
    Value: !Sub "ssh -i ${KeyPairName}.pem ec2-user@${EIP}"

  SetupTLSCommand:
    Description: Run on EC2 after DNS is configured
    Value: "sudo /opt/gtm/setup-tls.sh"

  RedeployCommand:
    Description: Run on EC2 to pull latest image and restart
    Value: "sudo /opt/gtm/deploy.sh"
